name: Deploy to GitHub Pages

# There is no build step: the site is the repository. The workflow uploads the
# static files as-is, which is the whole point of the example.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a newer commit supersede an in-flight deploy, but never cancel a running
# one midway -- a half-applied deploy would leave the site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch minimized SDK distribution
        run: |
          chmod +x scripts/fetch-sdk.sh
          ./scripts/fetch-sdk.sh

      - name: Stage the site
        # Copy only what the browser needs. dev.sh and the workflow itself are
        # developer tooling and are not served.
        run: |
          mkdir -p _site
          cp index.html styles.css jaydb-cloud.esm.min.js jaydb-cloud-sdk.js store.js app.js config.js README.md _site/

      - name: Verify every asset index.html references was staged
        # An explicit copy list silently drops a file when one is added or
        # renamed -- fail the build instead.
        run: |
          missing=0
          for ref in $(grep -oE '("\./[^"]+")' index.html | sed -E 's/.*"\.\/([^"]+)".*/\1/' | sort -u); do
            if [ ! -f "_site/$ref" ]; then
              echo "::error::index.html references $ref but it was not staged into _site/"
              missing=1
            fi
          done
          # The entry module must be present and must be able to resolve its local imports.
          for imported in $(grep -oE "from '\./[^']+'" *.js 2>/dev/null | sed -E "s/.*'\.\/([^']+)'.*/\1/" | sort -u); do
            if [ -n "$imported" ] && [ ! -f "_site/$imported" ]; then
              echo "::error::a module imports $imported but it was not staged into _site/"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "all referenced assets present"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
